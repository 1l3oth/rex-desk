[package]
name = "rex-desk"
version = "0.0.3"
description = "Rex Desk desktop window"
edition = "2021"
authors = ["Vong Pichdaraboth"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

# The see-through window (Settings, General): Windows makes the whole window layered and sets how solid it is.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
