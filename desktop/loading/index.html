<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rex Desk</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f3f6f6; color: #20353d; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { text-align: center; max-width: 28rem; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h1 small { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; padding: 2px 7px; border: 1px solid currentColor; border-radius: 999px; opacity: .7; }
  p { margin: 0; color: #5d6e75; }
  p.error { color: #9b2c2c; }
  button { margin-top: 16px; padding: 8px 18px; border: 0; border-radius: 8px; background: #4c8dff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button[hidden] { display: none; }
  @media (prefers-color-scheme: dark) { body { background: #14161a; color: #e6e8eb; } p { color: #9aa3b1; } p.error { color: #ff7b72; } }
</style>
</head>
<body>
<main>
  <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true" style="display:block;margin:0 auto 12px"><rect x="2" y="2" width="60" height="60" rx="14" fill="#4c8dff"/><g fill="#fff"><rect x="16" y="16" width="14" height="14" rx="3"/><rect x="34" y="16" width="14" height="14" rx="3"/><rect x="16" y="34" width="14" height="14" rx="3"/><rect x="34" y="34" width="14" height="14" rx="3" opacity=".47"/></g></svg>
  <h1>Rex Desk <small>Beta</small></h1>
  <p id="status">Starting the local server…</p>
  <button type="button" id="restart" hidden>Restart Rex Desk</button>
</main>
<script>
  const status = document.getElementById('status'), button = document.getElementById('restart');
  function showError(message) {
    status.textContent = message;
    status.className = 'error';
    button.hidden = false; button.disabled = false;
  }
  // The server stopped while the app was open: the app is already starting it again; the button does it right away.
  if (new URLSearchParams(location.search).has('down')) {
    status.textContent = 'Rex Desk stopped. Starting it again…';
    button.hidden = false;
  }
  // Whatever state this page is in (starting, error, after Restart), open Rex Desk as soon as the server answers.
  // An opaque no-cors reply means it is up; a refused connection rejects.
  const server = 'http://127.0.0.1:4317/';
  // /api/boot answers as soon as the server listens (its page then says what it is doing while it opens the workspace).
  async function open() { try { await fetch(server + 'api/boot', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(3000) }); location.replace(server); return true; } catch { return false; } }
  // The app keeps why the server could not start; asking for it means a fast failure is shown even if it happened
  // before this page finished loading.
  let shown = '';
  async function lastError() {
    try { const message = await window.__TAURI_INTERNALS__.invoke('startup_error'); if (message && message !== shown && !button.disabled) { shown = message; showError(message); } } catch {}
  }
  setInterval(() => { open(); lastError(); }, 2000);
  button.addEventListener('click', async () => {
    button.disabled = true; status.className = ''; status.textContent = 'Restarting Rex Desk…';
    try { await window.__TAURI_INTERNALS__.invoke('restart_server'); status.textContent = 'Rex Desk is back. Opening it…'; open(); }
    catch (error) { if (!(await open())) showError(String(error)); }
  });
</script>
</body>
</html>
