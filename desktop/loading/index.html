<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rex Desk</title>
<style>
  /* Dark from the first frame, like the app's own Midnight look, so opening Rex Desk never flashes a white screen. */
  body { margin: 0; height: 100vh; display: grid; place-items: center; color: #e6e8eb; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(900px 520px at 15% -10%, rgba(52, 92, 190, .38), transparent 60%), radial-gradient(800px 520px at 100% 110%, rgba(110, 60, 190, .3), transparent 60%), #0a0e19; }
  main { display: grid; justify-items: center; gap: 6px; text-align: center; max-width: 28rem; padding: 0 16px; }
  .rex-anim { margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h1 small { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; padding: 2px 7px; border: 1px solid currentColor; border-radius: 999px; opacity: .7; }
  p { margin: 0; color: #9aa3b1; }
  p.error { color: #ff7b72; }
  button { margin-top: 16px; padding: 8px 18px; border: 0; border-radius: 999px; background: #4c8dff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button[hidden] { display: none; }
/* The animated Rex Desk mark: four robot agents look around, then become the four white tiles of the logo (the last one
     faint: an agent waiting), a light sweeps across, and they turn back into agents. Pure CSS, loops every 4.2 s. */
  .rex-anim{--s:96px;position:relative;display:block;width:var(--s);height:var(--s);flex:none}
  .rex-anim i{position:absolute;display:block}
  .ra-base{inset:3.1%;border-radius:23.3%;background:linear-gradient(150deg,#78a8ff 0%,#4c8dff 42%,#3170e6 100%);box-shadow:inset 0 calc(var(--s)*.008) 0 rgba(255,255,255,.45),0 calc(var(--s)*.06) calc(var(--s)*.16) rgba(40,90,220,.4);overflow:hidden}
  .ra-sheen{top:-30%;bottom:-30%;left:-60%;width:36%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:ra-sheen 4.2s infinite}
  .ra-t{width:21.9%;height:21.9%;border-radius:50%;overflow:hidden;box-shadow:0 calc(var(--s)*.012) calc(var(--s)*.03) rgba(10,30,90,.28);animation:ra-move 4.2s cubic-bezier(.65,0,.35,1) infinite both,ra-shape 4.2s cubic-bezier(.65,0,.35,1) infinite both}
  .ra-t b{position:absolute;inset:0;background:#fff}
  .ra-t svg{position:absolute;inset:0;width:100%;height:100%;display:block;animation:ra-face 4.2s cubic-bezier(.65,0,.35,1) infinite both}
  .ra-1{left:25%;top:25%;--dx:calc(var(--s)*-.02);--dy:calc(var(--s)*-.02);--r:8deg}
  .ra-2{left:53.1%;top:25%;--dx:calc(var(--s)*.02);--dy:calc(var(--s)*-.02);--r:-7deg;animation-delay:.07s}
  .ra-3{left:25%;top:53.1%;--dx:calc(var(--s)*-.02);--dy:calc(var(--s)*.02);--r:-9deg;animation-delay:.14s}
  .ra-4{left:53.1%;top:53.1%;--dx:calc(var(--s)*.02);--dy:calc(var(--s)*.02);--r:7deg;animation-delay:.21s}
  .ra-2 svg,.ra-2 b{animation-delay:.07s}.ra-3 svg,.ra-3 b{animation-delay:.14s}.ra-4 svg{animation-delay:.21s}
  .ra-4 b{animation:ra-wait 4.2s infinite both}
  @keyframes ra-move{0%,6%{transform:translate(var(--dx),var(--dy)) scale(1.22) rotate(0)}14%{transform:translate(var(--dx),calc(var(--dy) - var(--s)*.03)) scale(1.24) rotate(var(--r))}23%{transform:translate(var(--dx),var(--dy)) scale(1.22) rotate(calc(var(--r)*-1))}31%,37%{transform:translate(var(--dx),var(--dy)) scale(1.22) rotate(0)}49%{transform:translate(0,0) scale(.94)}53%,86%{transform:translate(0,0) scale(1)}100%{transform:translate(var(--dx),var(--dy)) scale(1.22) rotate(0)}}
  @keyframes ra-shape{0%,37%{border-radius:50%}50%,86%{border-radius:21.4%}100%{border-radius:50%}}
  @keyframes ra-face{0%,37%{opacity:1}50%,86%{opacity:0}100%{opacity:1}}
  @keyframes ra-wait{0%,52%{opacity:1}60%,84%{opacity:.47}94%,100%{opacity:1}}
  @keyframes ra-sheen{0%,58%{left:-60%}74%,100%{left:140%}}
  @media (prefers-reduced-motion:reduce){.rex-anim *{animation:none!important}.ra-t{border-radius:21.4%}.ra-t svg{opacity:0}.ra-4 b{opacity:.47}}
</style>
</head>

  <h1>Rex Desk <small>Beta</small></h1>
  <p id="status">Starting the local server…</p>
  <button type="button" id="restart" hidden>Restart Rex Desk</button>
</main>
<script>
  const status = document.getElementById('status'), button = document.getElementById('restart');
  function showError(message) {
    status.textContent = message;
    status.className = 'error';
    button.hidden = false; button.disabled = false;
  }
  // The server stopped while the app was open: the app is already starting it again; the button does it right away.
  if (new URLSearchParams(location.search).has('down')) {
    status.textContent = 'Rex Desk stopped. Starting it again…';
    button.hidden = false;
  }
  // The server is running but not answering (the computer is busy): wait for it; Restart is there if it stays stuck.
  if (new URLSearchParams(location.search).has('busy')) {
    status.textContent = 'Rex Desk is busy. It opens again as soon as it answers; your agents keep working.';
    button.hidden = false;
  }
  // Whatever state this page is in (starting, error, after Restart), open Rex Desk as soon as the server answers.
  // An opaque no-cors reply means it is up; a refused connection rejects.
  const server = 'http://127.0.0.1:4317/';
  // /api/boot answers as soon as the server listens (its page then says what it is doing while it opens the workspace).
  async function open() { try { await fetch(server + 'api/boot', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(3000) }); location.replace(server); return true; } catch { return false; } }
  // The app keeps why the server could not start; asking for it means a fast failure is shown even if it happened
  // before this page finished loading.
  let shown = '';
  async function lastError() {
    try { const message = await window.__TAURI_INTERNALS__.invoke('startup_error'); if (message && message !== shown && !button.disabled) { shown = message; showError(message); } } catch {}
  }
  setInterval(() => { open(); lastError(); }, 2000);
  button.addEventListener('click', async () => {
    button.disabled = true; status.className = ''; status.textContent = 'Restarting Rex Desk…';
    try { await window.__TAURI_INTERNALS__.invoke('restart_server'); status.textContent = 'Rex Desk is back. Opening it…'; open(); }
    catch (error) { if (!(await open())) showError(String(error)); }
  });
</script>
</body>
