<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>Rex Desk</title>
<style>
  html { background: #0a0e19; }
  /* Dark from the first frame, like the app's own Midnight look, so opening Rex Desk never flashes a white screen. */
  body { margin: 0; height: 100vh; display: grid; place-items: center; color: #e6e8eb; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(900px 520px at 15% -10%, rgba(52, 92, 190, .38), transparent 60%), radial-gradient(800px 520px at 100% 110%, rgba(110, 60, 190, .3), transparent 60%), #0a0e19; }
  main { display: grid; justify-items: center; gap: 6px; text-align: center; max-width: 28rem; padding: 0 16px; }
  .rex-build { margin-bottom: 30px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  h1 small { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; vertical-align: middle; padding: 2px 7px; border: 1px solid currentColor; border-radius: 999px; opacity: .7; }
  p { margin: 0; color: #9aa3b1; }
  p.error { color: #ff7b72; }
  button { margin-top: 16px; padding: 8px 18px; border: 0; border-radius: 999px; background: #4c8dff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  button[hidden] { display: none; }
  /* The agents build the server while it starts: each robot brings a white block and drops it into the logo. */
  .rex-build{--s:104px;--t:6s;position:relative;display:block;width:var(--s);height:var(--s);flex:none}
  .rex-build i{position:absolute;display:block}
  .rb-base{inset:3.1%;border-radius:23.3%;background:linear-gradient(150deg,#78a8ff 0%,#4c8dff 42%,#3170e6 100%);box-shadow:inset 0 calc(var(--s)*.008) 0 rgba(255,255,255,.45),0 calc(var(--s)*.06) calc(var(--s)*.16) rgba(40,90,220,.4);overflow:hidden}
  .rb-sheen{top:-30%;bottom:-30%;left:-60%;width:36%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:rb-sheen var(--t) infinite}
  .rb-slot{width:21.9%;height:21.9%}
  .rb-1{left:25%;top:25%;--fx:calc(var(--s)*-1.1);--fy:calc(var(--s)*-.9)}
  .rb-2{left:53.1%;top:25%;--fx:calc(var(--s)*1.1);--fy:calc(var(--s)*-.9);--d:.75s}
  .rb-3{left:25%;top:53.1%;--fx:calc(var(--s)*-1.1);--fy:calc(var(--s)*.5);--d:1.5s}
  .rb-4{left:53.1%;top:53.1%;--fx:calc(var(--s)*1.1);--fy:calc(var(--s)*.5);--d:2.25s}
  .rb-block{inset:0;border-radius:21.4%;background:#fff;box-shadow:0 calc(var(--s)*.012) calc(var(--s)*.03) rgba(10,30,90,.3);animation:rb-block var(--t) cubic-bezier(.5,0,.3,1) var(--d,0s) infinite both}
  .rb-4 .rb-block{animation-name:rb-block-wait}
  .rb-bot{left:-25%;top:-25%;width:150%;height:150%;border-radius:50%;overflow:hidden;box-shadow:0 calc(var(--s)*.02) calc(var(--s)*.05) rgba(10,30,90,.35);animation:rb-bot var(--t) cubic-bezier(.5,0,.3,1) var(--d,0s) infinite both}
  .rb-bot svg{width:100%;height:100%;display:block}
  .rb-spark{inset:-30%;border-radius:50%;border:calc(var(--s)*.012) solid rgba(255,255,255,.9);opacity:0;animation:rb-spark var(--t) ease-out var(--d,0s) infinite both}
  @keyframes rb-bot{0%{transform:translate(var(--fx),var(--fy)) scale(.5) rotate(-20deg);opacity:0}3%{opacity:1}10%{transform:translate(0,calc(var(--s)*-.3)) scale(1) rotate(0)}13%{transform:translate(0,calc(var(--s)*-.24)) scale(1)}15%{transform:translate(0,calc(var(--s)*-.31)) scale(1)}24%{transform:translate(calc(var(--fx)*.5),calc(var(--s)*-1.1)) scale(.6) rotate(15deg);opacity:0}100%{transform:translate(calc(var(--fx)*.5),calc(var(--s)*-1.1)) scale(.6);opacity:0}}
  @keyframes rb-block{0%{transform:translate(var(--fx),calc(var(--fy) + var(--s)*.12)) scale(.5) rotate(-20deg);opacity:0}3%{opacity:1}10%{transform:translate(0,calc(var(--s)*-.08)) scale(1) rotate(0)}13%{transform:translate(0,0) scale(1.1)}15%{transform:translate(0,0) scale(.95)}17%,86%{transform:translate(0,0) scale(1);opacity:1}93%,100%{transform:translate(0,0) scale(.4);opacity:0}}
  @keyframes rb-block-wait{0%{transform:translate(var(--fx),calc(var(--fy) + var(--s)*.12)) scale(.5) rotate(-20deg);opacity:0}3%{opacity:1}10%{transform:translate(0,calc(var(--s)*-.08)) scale(1) rotate(0)}13%{transform:translate(0,0) scale(1.1)}15%{transform:translate(0,0) scale(.95)}17%{transform:translate(0,0) scale(1);opacity:1}24%,62%{opacity:.47;transform:none}93%,100%{transform:translate(0,0) scale(.4);opacity:0}}
  @keyframes rb-spark{0%,12%{transform:scale(.6);opacity:0}13%{opacity:.9;transform:scale(.7)}20%,100%{transform:scale(1.5);opacity:0}}
  @keyframes rb-sheen{0%,64%{left:-60%}78%,100%{left:140%}}
  @media (prefers-reduced-motion:reduce){.rex-build *{animation:none!important}.rb-bot,.rb-spark{display:none!important}.rb-4 .rb-block{opacity:.47}}
</style>
</head>
<body>

  <h1>Rex Desk <small>Beta</small></h1>
  <p id="status">Starting the local server…</p>
  <button type="button" id="restart" hidden>Restart Rex Desk</button>
</main>
<script>
  const status = document.getElementById('status'), button = document.getElementById('restart');
  function showError(message) {
    status.textContent = message;
    status.className = 'error';
    button.hidden = false; button.disabled = false;
  }
  // The server stopped while the app was open: the app is already starting it again; the button does it right away.
  if (new URLSearchParams(location.search).has('down')) {
    status.textContent = 'Rex Desk stopped. Starting it again…';
    button.hidden = false;
  }
  // The server is running but not answering (the computer is busy): wait for it; Restart is there if it stays stuck.
  if (new URLSearchParams(location.search).has('busy')) {
    status.textContent = 'Rex Desk is busy. It opens again as soon as it answers; your agents keep working.';
    button.hidden = false;
  }
  // Whatever state this page is in (starting, error, after Restart), open Rex Desk as soon as the server answers.
  // An opaque no-cors reply means it is up; a refused connection rejects.
  const server = 'http://127.0.0.1:4317/';
  // /api/boot answers as soon as the server listens (its page then says what it is doing while it opens the workspace).
  async function open() { try { await fetch(server + 'api/boot', { mode: 'no-cors', cache: 'no-store', signal: AbortSignal.timeout(3000) }); location.replace(server); return true; } catch { return false; } }
  // The app keeps why the server could not start; asking for it means a fast failure is shown even if it happened
  // before this page finished loading.
  let shown = '';
  async function lastError() {
    try { const message = await window.__TAURI_INTERNALS__.invoke('startup_error'); if (message && message !== shown && !button.disabled) { shown = message; showError(message); } } catch {}
  }
  setInterval(() => { open(); lastError(); }, 2000);
  button.addEventListener('click', async () => {
    button.disabled = true; status.className = ''; status.textContent = 'Restarting Rex Desk…';
    try { await window.__TAURI_INTERNALS__.invoke('restart_server'); status.textContent = 'Rex Desk is back. Opening it…'; open(); }
    catch (error) { if (!(await open())) showError(String(error)); }
  });
</script>
</body>
</html>
