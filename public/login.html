<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rex Desk">
<meta name="theme-color" content="#16181d">
<title>Rex Desk · Sign in</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main>
  <form method="post" action="/login">
    <h1>Rex Desk</h1>
    <p>Paste the key from <b>Devices</b> in Rex Desk on your computer.</p>
    <input type="password" name="key" placeholder="Device key" autocomplete="current-password" required autofocus>
    <p class="wrong">That key is not right. Copy it again from Devices.</p>
    <button type="submit">Sign in</button>
  </form>
</main>
</body>
</html>
