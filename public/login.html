<!doctype html>
<html lang="en" data-km-title="Rex Desk · ចូល">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Rex Desk">
<meta name="theme-color" content="#16181d">
<title>Rex Desk · Sign in</title>
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main>
  <form method="post" action="/login">
    <h1>Rex Desk</h1>
    <p data-km="ដាក់សោពី <b>ឧបករណ៍</b> ក្នុង Rex Desk នៅលើកុំព្យូទ័ររបស់អ្នក។">Paste the key from <b>Devices</b> in Rex Desk on your computer.</p>
    <input type="password" name="key" placeholder="Device key" data-km-placeholder="សោឧបករណ៍" autocomplete="current-password" required autofocus>
    <p class="wrong" data-km="សោនេះមិនត្រឹមត្រូវទេ។ ចម្លងវាម្ដងទៀតពីឧបករណ៍។">That key is not right. Copy it again from Devices.</p>
    <button type="submit" data-km="ចូល">Sign in</button>
  </form>
</main>
<script src="/i18n-static.js"></script>
</body>
</html>
