name: Desktop installers

# Builds the installable Rex Desk app (bundled Node and server) for Windows (.exe, .msi, portable .zip), macOS (.dmg) and
# Linux x64 (.deb, .AppImage). After the build, "try" installs each Windows and Linux package on a clean machine, opens it
# and checks that its server answers; on Windows it also upgrades the version people have now to this one.
# Run it from the Actions tab: pick a channel and it builds, signs the update, and uploads everything to the downloads
# bucket (Cloudflare R2 or AWS S3). Installed apps on that channel then update themselves.
#   beta    test releases; only apps started with REX_UPDATE_CHANNEL=beta take them
#   stable  everyone
#   none    build only, nothing is uploaded
# Every run also publishes a pre-release in this repository, as before. A tag like desktop-v0.2.2 only builds that pre-release.
#
# One-time setup, under Settings → Secrets and variables → Actions:
#   Secrets    REX_RELEASE_KEY_PEM (the Ed25519 release key), RELEASE_S3_ACCESS_KEY_ID, RELEASE_S3_SECRET_ACCESS_KEY
#   Variables  RELEASE_S3_BUCKET, RELEASE_S3_ENDPOINT (R2: https://<account>.r2.cloudflarestorage.com; leave empty for AWS),
#              RELEASE_S3_REGION (R2: auto), RELEASE_BASE_URL (only when the public address is not the one in src/updates.js)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Who gets this build as an update: beta (testers), stable (everyone), none (build only)"
        type: choice
        options: [beta, stable, none]
        default: beta
      version:
        description: "Version to build, like 0.3.0. Empty uses the version in desktop/src-tauri/tauri.conf.json"
        required: false
        type: string
      notes:
        description: "What changed, shown to people in Settings → Updates. Required for beta and stable"
        required: false
        type: string
      notes_only:
        description: "Only correct the notes of the version this channel already ships (give that version); nothing is built"
        required: false
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']

run-name: "Desktop ${{ inputs.version || '(repo version)' }} → ${{ inputs.channel || 'pre-release only' }}"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails at once, not after the build: beta and stable need notes, and a notes correction needs the version it corrects.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the inputs
        env:
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ inputs.version }}
          NOTES_ONLY: ${{ inputs.notes_only }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then exit 0; fi
          if [ "$CHANNEL" != "none" ] && [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then echo "::error::Release notes are empty. Write what changed in the notes input."; exit 1; fi
          if [ "$NOTES_ONLY" = "true" ] && { [ "$CHANNEL" = "none" ] || [ -z "$VERSION" ]; }; then echo "::error::A notes correction needs a channel and the version that channel ships."; exit 1; fi

  # Puts new notes on the version a channel already ships: only its latest.json changes, never an installer or another version.
  notes:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.notes_only && inputs.channel != 'none' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-publish-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correct the notes
        env:
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ inputs.version }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          RELEASE_S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
          RELEASE_S3_ENDPOINT: ${{ vars.RELEASE_S3_ENDPOINT }}
          RELEASE_S3_REGION: ${{ vars.RELEASE_S3_REGION }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: node scripts/release-desktop.mjs --notes-only --channel "$CHANNEL" --version "$VERSION" --notes="$NOTES"

  build:
    needs: check
    if: "!inputs.notes_only"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows gets three: the .exe installer, an .msi (often allowed where unknown .exe files are blocked), and a portable .zip.
          - os: windows-latest
            bundle: nsis,msi
            name: windows
            files: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
              dist/*.zip
          # Linux x64: a .deb for Debian and Ubuntu (apt brings the libraries it needs; IT pushes it like any package) and an
          # AppImage for other distributions, which updates itself. Built on Ubuntu 22.04, so it runs on Ubuntu 22.04 and
          # newer, Debian 12 and newer, and the distributions built on them.
          - os: ubuntu-22.04
            bundle: deb,appimage
            name: linux
            files: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          # "app" keeps Rex Desk.app after the .dmg is made, so it can be packed for self-update.
          - os: macos-latest
            bundle: app,dmg
            name: macos
            files: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
              dist/*.app.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The libraries Tauri builds against on Linux (the window's web view, the tray icon); the .deb then names them as its dependencies.
      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: node desktop/version.mjs "$VERSION"
      # stage.mjs copies this Node and the server into the payload; tauri build packs it into the installer.
      - run: npm run build -- --bundles ${{ matrix.bundle }}
        working-directory: desktop
      # Portable Windows copy: no installer, just unzip and run rex-desk.exe (it finds its payload folder beside it).
      - name: Pack the portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $folder = "dist/Rex Desk"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item desktop/src-tauri/target/release/rex-desk.exe $folder
          Copy-Item -Recurse desktop/src-tauri/payload "$folder/payload"
          Compress-Archive -Path $folder -DestinationPath "dist/Rex.Desk_${version}_x64-portable.zip"
      # Without an Apple certificate the app is signed ad hoc ("-" in tauri.conf.json): its whole bundle is sealed, so macOS says
      # it cannot verify the developer (Open Anyway in Privacy & Security) instead of calling the app damaged. A seal that does
      # not hold fails the build here, before anyone downloads it.
      - name: Check the Mac app's seal
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 "desktop/src-tauri/target/release/bundle/macos/Rex Desk.app"
          codesign -dv "desktop/src-tauri/target/release/bundle/macos/Rex Desk.app" 2>&1 | grep -E "Signature|Identifier|Sealed"
      # The Mac app cannot update itself from a .dmg; it downloads this packed copy of the app and swaps it in.
      - name: Pack the Mac app for self-update
        if: runner.os == 'macOS'
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/Rex Desk_${version}_aarch64.app.tar.gz" -C desktop/src-tauri/target/release/bundle/macos "Rex Desk.app"
      - uses: actions/upload-artifact@v4
        with:
          name: rex-desk-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # The only job that holds the release key and the bucket keys; the build jobs above run third-party code without them.
  publish:
    needs: build
    # Only master ships: a run started from another branch builds, but its code never gets the release key or reaches people.
    if: github.event_name == 'workflow_dispatch' && inputs.channel != 'none' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: desktop-publish-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Sign, upload and check the release
        env:
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
          REX_RELEASE_KEY_PEM: ${{ secrets.REX_RELEASE_KEY_PEM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          RELEASE_S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
          RELEASE_S3_ENDPOINT: ${{ vars.RELEASE_S3_ENDPOINT }}
          RELEASE_S3_REGION: ${{ vars.RELEASE_S3_REGION }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: node scripts/release-desktop.mjs --files dist --channel "$CHANNEL" --notes="$NOTES" --upload

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish a pre-release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="desktop-v${version}-build${GITHUB_RUN_NUMBER}"; fi
          cat > notes.md <<EOF
          Rex Desk ${version} desktop installers, built from ${GITHUB_SHA::7}.

          These installers are not code-signed yet.
          - **Windows:** run the .exe. If SmartScreen says "Windows protected your PC", choose More info, then Run anyway. If .exe installers are blocked on your computer, use the .msi, or unzip the portable .zip and run rex-desk.exe inside it.
          - **Windows for IT:** the .msi installs for every user on the computer and works with the usual deployment tools (Intune, Group Policy, SCCM): \`msiexec /i <file>.msi /qn\`.
          - **Linux (Ubuntu 22.04+, Debian 12+):** \`sudo apt install ./<file>.deb\`. Other distributions: make the .AppImage executable and run it; it updates itself.
          - **macOS (Apple Silicon):** open the .dmg and drag Rex Desk to Applications. The first time, right-click Rex Desk and choose Open. If macOS says the app is damaged, run \`xattr -cr "/Applications/Rex Desk.app"\` in Terminal once.
          EOF
          mapfile -t files < <(find dist -type f -name '*.exe' -o -type f -name '*.msi' -o -type f -name '*.dmg' -o -type f -name '*.zip' -o -type f -name '*.tar.gz' -o -type f -name '*.deb' -o -type f -name '*.AppImage')
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Rex Desk ${version} (unsigned build ${GITHUB_RUN_NUMBER})" --notes-file notes.md

  # Installs what was just built on a clean GitHub machine, opens it and checks that its server answers (GET /api/boot on
  # 127.0.0.1:4317). Windows: the .exe and the .msi each upgrade the version people have now (stable latest.json) to this
  # build, and data written before the upgrade must still be there after it. Linux: the .deb installs with apt, upgrades
  # over itself, and removes cleanly; the AppImage runs and says it can update itself.
  try:
    needs: build
    if: "!inputs.notes_only"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rex-desk-${{ matrix.name }}
          path: built
      - name: Try the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/try-installers.ps1 -Built built
      - name: Try the Linux packages
        if: runner.os == 'Linux'
        run: bash scripts/try-installers.sh built
