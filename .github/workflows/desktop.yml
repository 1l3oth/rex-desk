name: Desktop installers

# Builds the installable Rex Desk app (bundled Node and server) for Windows (.exe) and macOS (.dmg).
# The installers are not code-signed yet, so Windows SmartScreen and macOS Gatekeeper warn on first open.
# Run it from the Actions tab, or push a tag like desktop-v0.2.2. Each run publishes a pre-release in this repository;
# pre-releases never count as "latest", so the signed auto-update channel in DaraBoth/rex-desk-releases is not touched.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows gets three: the .exe installer, an .msi (often allowed where unknown .exe files are blocked), and a portable .zip.
          - os: windows-latest
            bundle: nsis,msi
            name: windows
            files: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
              dist/*.zip
          - os: macos-latest
            bundle: dmg
            name: macos
            files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      # stage.mjs copies this Node and the server into the payload; tauri build packs it into the installer.
      - run: npm run build -- --bundles ${{ matrix.bundle }}
        working-directory: desktop
      # Portable Windows copy: no installer, just unzip and run rex-desk.exe (it finds its payload folder beside it).
      - name: Pack the portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $folder = "dist/Rex Desk"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item desktop/src-tauri/target/release/rex-desk.exe $folder
          Copy-Item -Recurse desktop/src-tauri/payload "$folder/payload"
          Compress-Archive -Path $folder -DestinationPath "dist/Rex.Desk_${version}_x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rex-desk-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish a pre-release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="desktop-v${version}-build${GITHUB_RUN_NUMBER}"; fi
          cat > notes.md <<EOF
          Rex Desk ${version} desktop installers, built from ${GITHUB_SHA::7}.

          These installers are not code-signed yet.
          - **Windows:** run the .exe. If SmartScreen says "Windows protected your PC", choose More info, then Run anyway. If .exe installers are blocked on your computer, use the .msi, or unzip the portable .zip and run rex-desk.exe inside it.
          - **macOS (Apple Silicon):** open the .dmg and drag Rex Desk to Applications. The first time, right-click Rex Desk and choose Open. If macOS says the app is damaged, run \`xattr -cr "/Applications/Rex Desk.app"\` in Terminal once.
          EOF
          mapfile -t files < <(find dist -type f -name '*.exe' -o -type f -name '*.msi' -o -type f -name '*.dmg' -o -type f -name '*.zip')
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Rex Desk ${version} (unsigned build ${GITHUB_RUN_NUMBER})" --notes-file notes.md
