name: Desktop installers

# Builds the installable Rex Desk app (bundled Node and server) for Windows (.exe, .msi, portable .zip) and macOS (.dmg).
# Run it from the Actions tab: pick a channel and it builds, signs the update, and uploads everything to the downloads
# bucket (Cloudflare R2 or AWS S3). Installed apps on that channel then update themselves.
#   beta    test releases; only apps started with REX_UPDATE_CHANNEL=beta take them
#   stable  everyone
#   none    build only, nothing is uploaded
# Every run also publishes a pre-release in this repository, as before. A tag like desktop-v0.2.2 only builds that pre-release.
#
# One-time setup, under Settings → Secrets and variables → Actions:
#   Secrets    REX_RELEASE_KEY_PEM (the Ed25519 release key), RELEASE_S3_ACCESS_KEY_ID, RELEASE_S3_SECRET_ACCESS_KEY
#   Variables  RELEASE_S3_BUCKET, RELEASE_S3_ENDPOINT (R2: https://<account>.r2.cloudflarestorage.com; leave empty for AWS),
#              RELEASE_S3_REGION (R2: auto), RELEASE_BASE_URL (only when the public address is not the one in src/updates.js)
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Who gets this build as an update: beta (testers), stable (everyone), none (build only)"
        type: choice
        options: [beta, stable, none]
        default: beta
      version:
        description: "Version to build, like 0.3.0. Empty uses the version in desktop/src-tauri/tauri.conf.json"
        required: false
        type: string
      notes:
        description: "What changed, shown to people in Settings → Updates"
        required: false
        type: string
  push:
    tags: ['desktop-v*']

run-name: "Desktop ${{ inputs.version || '(repo version)' }} → ${{ inputs.channel || 'pre-release only' }}"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows gets three: the .exe installer, an .msi (often allowed where unknown .exe files are blocked), and a portable .zip.
          - os: windows-latest
            bundle: nsis,msi
            name: windows
            files: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
              dist/*.zip
          - os: macos-latest
            bundle: dmg
            name: macos
            files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: node desktop/version.mjs "$VERSION"
      # stage.mjs copies this Node and the server into the payload; tauri build packs it into the installer.
      - run: npm run build -- --bundles ${{ matrix.bundle }}
        working-directory: desktop
      # Portable Windows copy: no installer, just unzip and run rex-desk.exe (it finds its payload folder beside it).
      - name: Pack the portable Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $folder = "dist/Rex Desk"
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item desktop/src-tauri/target/release/rex-desk.exe $folder
          Copy-Item -Recurse desktop/src-tauri/payload "$folder/payload"
          Compress-Archive -Path $folder -DestinationPath "dist/Rex.Desk_${version}_x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: rex-desk-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  # The only job that holds the release key and the bucket keys; the build jobs above run third-party code without them.
  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.channel != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: desktop-publish-${{ inputs.channel }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Sign, upload and check the release
        env:
          CHANNEL: ${{ inputs.channel }}
          NOTES: ${{ inputs.notes }}
          REX_RELEASE_KEY_PEM: ${{ secrets.REX_RELEASE_KEY_PEM }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_S3_SECRET_ACCESS_KEY }}
          RELEASE_S3_BUCKET: ${{ vars.RELEASE_S3_BUCKET }}
          RELEASE_S3_ENDPOINT: ${{ vars.RELEASE_S3_ENDPOINT }}
          RELEASE_S3_REGION: ${{ vars.RELEASE_S3_REGION }}
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
        run: node scripts/release-desktop.mjs --files dist --channel "$CHANNEL" --notes "$NOTES" --upload

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish a pre-release with both installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; else tag="desktop-v${version}-build${GITHUB_RUN_NUMBER}"; fi
          cat > notes.md <<EOF
          Rex Desk ${version} desktop installers, built from ${GITHUB_SHA::7}.

          These installers are not code-signed yet.
          - **Windows:** run the .exe. If SmartScreen says "Windows protected your PC", choose More info, then Run anyway. If .exe installers are blocked on your computer, use the .msi, or unzip the portable .zip and run rex-desk.exe inside it.
          - **macOS (Apple Silicon):** open the .dmg and drag Rex Desk to Applications. The first time, right-click Rex Desk and choose Open. If macOS says the app is damaged, run \`xattr -cr "/Applications/Rex Desk.app"\` in Terminal once.
          EOF
          mapfile -t files < <(find dist -type f -name '*.exe' -o -type f -name '*.msi' -o -type f -name '*.dmg' -o -type f -name '*.zip')
          gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Rex Desk ${version} (unsigned build ${GITHUB_RUN_NUMBER})" --notes-file notes.md
