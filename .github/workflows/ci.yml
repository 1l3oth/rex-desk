name: CI

# Every pull request runs the unit tests and the recorded browser acceptance test on Windows, where Rex Desk runs.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: full unit tests, 3 rounds
        shell: bash
        run: |
          fails=0
          for i in 1 2 3; do echo ROUND $i; npm test > round$i.txt 2>&1 || fails=$((fails+1)); grep -E "DIAG|PICKED|REQ|FIN|slow voice engine load cannot|^ℹ (pass|fail)" round$i.txt | grep -v speak/voices; done
          echo FAILED_ROUNDS $fails
