name: CI

# Every pull request runs the unit tests and the recorded browser acceptance test on Windows, where Rex Desk runs.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: voice test under load, 4 rounds
        shell: bash
        run: |
          fails=0
          for i in 1 2 3 4; do echo ROUND $i; node --test test/settings-autosave.test.js test/peer-files.test.js test/composer-ai-per-chat.test.js test/peers.test.js test/project-rules.test.js || fails=$((fails+1)); done
          echo FAILED_ROUNDS $fails
